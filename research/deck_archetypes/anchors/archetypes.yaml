# Hand-seeded GOLD archetypes for anchor-retrieval evaluation.
#
# You do NOT need to label many decks. Two kinds of anchors, either or both per
# archetype:
#   - core_cards: card NAMES that (near-)define the archetype. Cheapest signal.
#       Must match `name` in cards.jsonl exactly (the harness resolves name ->
#       card_id). Names are used, not codes/uuids, because they're human-typable
#       and survive a DB rebuild. Eval asks: are a core card's nearest cards the
#       OTHER core cards?
#   - decks:      a few deck ids you're confident belong to the archetype. Grab
#       these straight from the app: the uuid in a /decks/:id URL. Eval asks: are
#       an anchor deck's k-NN mostly the same archetype label?
#
# 5-10 archetypes x a handful each is plenty. Copy to anchors/archetypes.yaml
# (that filename is gitignored / yours to edit) and fill in real values.

archetypes:
  - label: firepower
    notes: >
      Weapon/tech upgrades centered on Firepower; upgrades that ready or don't
      need to exhaust. Cross-hero (War Machine, Iron Man, Spider-Man, ...).
    core_cards: ["Firepower", "Jarnbjorn", "S.H.I.E.L.D. Sidearm", "Pulse Grenade"]
    # From the deck-browser query: has Firepower AND (Sidearm|Pulse Grenade|Jarnbjorn).
    decks:
      - "019f7079-bf29-786e-b215-1e607724a084"
      - "019f706f-3528-7469-a0b6-4af52afb60d1"
      - "019fa1f1-c996-7c41-a41a-b48ec91e8051"  # Guess Who Remembered Their Ammo Bag?
      - "019f94a4-0a49-759a-9fc5-223a0245a164"  # Cold Steel, Hot Lead
