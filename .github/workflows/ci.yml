name: Elixir CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  # Manual (re)generation of user-facing release notes for an existing tag:
  # iterate on .github/release-notes-prompt.md or backfill past releases.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to write notes for (e.g. v1.82.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  dialyzer:
    name: Run Dialyzer
    runs-on: ubuntu-latest
    if: false
    env:
      MIX_ENV: dev
    strategy:
      matrix:
        elixir: ["1.18"]
        otp: ["28"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-app: false

      # Don't cache PLTs based on mix.lock hash, as Dialyzer can incrementally update even old ones
      # Cache key based on Elixir & Erlang version (also useful when running in matrix)
      - name: Restore PLT cache
        uses: actions/cache@v6
        id: plt_cache
        with:
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-
          path: priv/plts

      # Create PLTs if no cache was found.
      # Always rebuild PLT when a job is retried
      # (If they were cached at all, they'll be updated when we run mix dialyzer with no flags.)
      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true' || github.run_attempt != '1'
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format github

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit, not just the checkout
          fetch-depth: 0

      # Uses .gitleaks.toml at the repo root (allowlists the known-benign
      # Phoenix dev/test keys that live in history)
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Formatting, Credo, and Unused Deps
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        elixir: ["1.18"]
        otp: ["28"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-app: false

      - name: Check for unused deps
        run: mix deps.unlock --check-unused
      - name: Check code formatting
        run: mix format --check-formatted
        # Check formatting even if there were unused deps so that
        # we give devs as much feedback as possible & save some time.
        if: always()
      - name: Run Credo
        run: mix credo suggest --min-priority=normal
        # allow credo to pass if only design issues are found. See -> https://hexdocs.pm/credo/exit_statuses.html
        # Run Credo even if formatting or the unused deps check failed
        if: always()
      - name: Check for code duplication
        # Zero tolerance: any detected clone fails the build — extract the
        # shared logic instead. If a clone's fix rides another unmerged
        # branch, a temporary --max-clones N ratchet is acceptable; keep in
        # sync with the ck alias in mix.exs.
        run: mix ex_dna
        if: always()
      - name: Check for security vulnerabilities in Phoenix project
        run: mix sobelow --config --exit
        if: always()


  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    env:
      MIX_ENV: test
    strategy:
      matrix:
        elixir: ["1.18"]
        otp: ["28"]
    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-flags: --all-warnings --warnings-as-errors

      - name: Run Tests
        run: mix coveralls.json --warnings-as-errors
        if: always()


  changelog:
    name: Changelog
    needs:
      - lint
      - build_and_test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Serialize release runs so concurrent pushes to main don't race to create
    # the same version tag (e.g. `fatal: tag 'v1.0.0' already exists`). Queued
    # runs wait for the in-progress release instead of cancelling it, so each
    # push gets its changelog/tag off an up-to-date main.
    concurrency:
      group: changelog-release
      cancel-in-progress: false

    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      clean_changelog: ${{ steps.changelog.outputs.clean_changelog }}
      version: ${{ steps.changelog.outputs.version }}

    env:
      PR_BRANCH: release-ci-${{ github.sha }}

    steps:
      # Check out the tip of main, NOT the triggering commit. The changelog
      # action derives the next version by bumping the version in mix.exs, so it
      # must read the latest mix.exs — the one that already includes the version
      # bump merged by the previous release run. Building off the (stale)
      # triggering SHA makes every push that predates the last release-bump
      # recompute the same version and collide on the tag
      # (`fatal: tag 'vX.Y.Z' already exists`). The concurrency group above
      # guarantees the previous run's bump has landed on main before this runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Create Branch
        run: |
          git checkout -b ${{ env.PR_BRANCH }}

      - name: Create Changelog
        uses: TriPSs/conventional-changelog-action@v6
        id: changelog
        with:
          github-token: ${{ secrets.github_token }}
          git-user-name: "github-actions[bot]"
          git-user-email: "github-actions[bot]@users.noreply.github.com"
          git-branch: ${{ env.PR_BRANCH }}
          skip-git-pull: true
          version-file: mix.exs
          create-summary: true

      - name: Create Changelog PR
        if: steps.changelog.outputs.skipped == 'false'
        # Pass the title/body through env vars rather than inlining them into the
        # command. The changelog body can contain quotes and other shell
        # metacharacters (an apostrophe once broke `--body '...'` quoting), which
        # is both a correctness bug and a command-injection risk.
        run: |
          gh pr create --base main --head "$PR_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          PR_TITLE: "chore(release): ${{ steps.changelog.outputs.tag }} [skip-ci]"
          PR_BODY: ${{ steps.changelog.outputs.clean_changelog }}

      - name: Merge Changelog PR
        if: steps.changelog.outputs.skipped == 'false'
        run: |
          gh pr merge --merge --delete-branch ${{ env.PR_BRANCH }}
        env:
          GH_TOKEN: ${{ secrets.github_token }}

  release_notes:
    name: Generate release notes
    needs: changelog
    # Runs after a real release (push -> changelog cut a new version), or by
    # hand via workflow_dispatch against an existing tag. !cancelled() is
    # required so the job still evaluates when changelog was skipped (dispatch).
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && needs.changelog.result == 'success' && needs.changelog.outputs.skipped == 'false') ||
        github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-notes
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.changelog.outputs.tag || inputs.tag }}
    steps:
      # Same reasoning as the changelog job: build off post-release main so
      # the notes branch contains the version bump.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Build release-notes prompt
        id: prompt
        env:
          CHANGELOG_BODY: ${{ needs.changelog.outputs.clean_changelog }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: '$RELEASE_TAG'"; exit 1
          fi
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null \
            || { echo "::error::Tag $RELEASE_TAG does not exist"; exit 1; }
          # Backfills have no changelog output — fall back to the tag's
          # CHANGELOG.md section (minor/major headers are '#', patch '##').
          if [ -z "$CHANGELOG_BODY" ]; then
            CHANGELOG_BODY="$(awk -v v="${RELEASE_TAG#v}" '/^#{1,2} \[/{ if (found) exit; if (index($0, "[" v "]")) {found=1; next} } found' CHANGELOG.md)"
          fi
          PREV_TAG="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          RANGE="${PREV_TAG:+$PREV_TAG..}$RELEASE_TAG"
          RELEASE_DATE="$(git log -1 --format=%cs "$RELEASE_TAG")"
          # On dispatch, use the prompt from the dispatched ref so prompt
          # tweaks can be tested from a branch; the working tree stays on main.
          PROMPT_SRC="$(git show "$GITHUB_SHA:.github/release-notes-prompt.md" 2>/dev/null || cat .github/release-notes-prompt.md)"
          PROMPT_FILE="$RUNNER_TEMP/release-notes-prompt.md"
          {
            printf '%s\n\n' "$PROMPT_SRC"
            printf '## Release context\n\n'
            printf -- '- Tag: %s\n- Date: %s\n- Commit range: %s\n- Output file: priv/release_notes/%s.md\n\n' \
              "$RELEASE_TAG" "$RELEASE_DATE" "$RANGE" "$RELEASE_TAG"
            printf '## Changelog\n\n%s\n' "${CHANGELOG_BODY:-(none — use git log on the commit range)}"
          } > "$PROMPT_FILE"
          echo "notes_path=priv/release_notes/$RELEASE_TAG.md" >> "$GITHUB_OUTPUT"

      # NOTE: anthropics/claude-code-action (top level) throws "Unsupported
      # event type: push" (src/github/context.ts), and this job runs
      # downstream of a push. base-action is the same repo's thin CLI wrapper
      # with no GitHub-context/token dependency — use it, not the mirror repo
      # anthropics/claude-code-base-action (stale tags).
      - name: Generate user-facing release notes with Claude Code
        id: claude
        uses: anthropics/claude-code-action/base-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: ${{ runner.temp }}/release-notes-prompt.md
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git describe:*)"

      - name: Validate generated notes
        id: notes
        env:
          NOTES_PATH: ${{ steps.prompt.outputs.notes_path }}
        run: |
          set -euo pipefail
          # Claude may only have produced the one notes file; any change to
          # a tracked file means it went off-script.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Claude modified tracked files:"; git status --porcelain --untracked-files=no; exit 1
          fi
          if [ ! -f "$NOTES_PATH" ]; then
            echo "::error::Claude did not write $NOTES_PATH"; exit 1
          fi
          if [ "$(tr -d '[:space:]' < "$NOTES_PATH")" = "NO_USER_FACING_CHANGES" ]; then
            echo "No user-facing changes in $RELEASE_TAG — skipping PR."
            echo "has_notes=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! head -n1 "$NOTES_PATH" | grep -Eq '^Date: [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::$NOTES_PATH must start with a 'Date: YYYY-MM-DD' line"; cat "$NOTES_PATH"; exit 1
          fi
          echo "has_notes=true" >> "$GITHUB_OUTPUT"

      # Deliberately NOT auto-merged: a human reviews/edits the notes in the
      # PR. No [skip ci] either — merging must trigger fly-deploy.yml to ship
      # the notes. docs(...) is a non-bumping type, so the merge doesn't cut
      # another release.
      - name: Open release-notes PR
        if: steps.notes.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          NOTES_PATH: ${{ steps.prompt.outputs.notes_path }}
          BRANCH: release-notes-${{ env.RELEASE_TAG }}
          PR_TITLE: "docs(release-notes): ${{ env.RELEASE_TAG }}"
          PR_BODY: |
            Auto-generated user-facing release notes for ${{ env.RELEASE_TAG }}.
            Review and edit before merging. Nothing appears on the site until this is merged.
            Keep any edit commits non-bumping (plain message or `docs:` prefix) so merging doesn't cut a new release.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -- "$NOTES_PATH"
          git commit -m "$PR_TITLE"
          # Re-dispatching the same tag regenerates the notes: force-update
          # the branch and reuse an already-open PR instead of failing.
          git push --force -u origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "Updated existing PR for $BRANCH"
          else
            gh pr create --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi
