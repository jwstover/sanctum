name: Elixir CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
    # Release-notes PRs are opened by GITHUB_TOKEN, and GitHub rejects the
    # run (0 jobs, red X) because it can't grant this workflow's write
    # permissions. A notes-only diff has nothing to test, and the merge
    # still runs full CI on main.
    paths-ignore:
      - 'priv/release_notes/**'

# Nothing here writes since releases moved to release.yml. Read-only also
# keeps bot-opened release PRs clear of the write-permission rejection above.
permissions:
  contents: read
  pull-requests: read

jobs:
  dialyzer:
    name: Run Dialyzer
    runs-on: ubuntu-latest
    if: false
    env:
      MIX_ENV: dev
    strategy:
      matrix:
        elixir: ["1.18"]
        otp: ["28"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-app: false

      # Don't cache PLTs based on mix.lock hash, as Dialyzer can incrementally update even old ones
      # Cache key based on Elixir & Erlang version (also useful when running in matrix)
      - name: Restore PLT cache
        uses: actions/cache@v6
        id: plt_cache
        with:
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/*.ex') }}
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}-
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-
          path: priv/plts

      # Create PLTs if no cache was found.
      # Always rebuild PLT when a job is retried
      # (If they were cached at all, they'll be updated when we run mix dialyzer with no flags.)
      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true' || github.run_attempt != '1'
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --format github

  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit, not just the checkout
          fetch-depth: 0

      # Uses .gitleaks.toml at the repo root (allowlists the known-benign
      # Phoenix dev/test keys that live in history)
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Formatting, Credo, and Unused Deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        elixir: ["1.18"]
        otp: ["28"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-app: false

      - name: Check for unused deps
        run: mix deps.unlock --check-unused
      - name: Check code formatting
        run: mix format --check-formatted
        # Check formatting even if there were unused deps so that
        # we give devs as much feedback as possible & save some time.
        if: always()
      - name: Run Credo
        run: mix credo suggest --min-priority=normal
        # allow credo to pass if only design issues are found. See -> https://hexdocs.pm/credo/exit_statuses.html
        # Run Credo even if formatting or the unused deps check failed
        if: always()
      - name: Check for code duplication
        # Zero tolerance: any detected clone fails the build — extract the
        # shared logic instead. If a clone's fix rides another unmerged
        # branch, a temporary --max-clones N ratchet is acceptable; keep in
        # sync with the ck alias in mix.exs.
        run: mix ex_dna
        if: always()
      - name: Check for security vulnerabilities in Phoenix project
        run: mix sobelow --config --exit
        if: always()


  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        elixir: ["1.18"]
        otp: ["28"]
    services:
      postgres:
        image: postgres:16
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: "postgres"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          build-flags: --all-warnings --warnings-as-errors

      - name: Run Tests
        run: mix coveralls.json --warnings-as-errors
        if: always()

